<!-- DESKTOP HEADER SECTION -->
<header class="desktop-header" id="desktopHeader">
  <div class="desktop-header-inner">
    <div class="desktop-brand">
      <img src="assets/logo.png" alt="LokaLink Logo" class="logo-img" style="height:36px">
      LokaLink
    </div>
    <nav class="desktop-links" id="desktopLinks"></nav>
    <button class="desktop-role-switch" onclick="switchRole()">Switch Role</button>
    <div class="desktop-account">
      <img id="desktopAvatar" src="https://i.pravatar.cc/100?img=12" alt="User">
      <div>
        <strong id="desktopName">Alex Morgan</strong>
        <span id="desktopRole">Traveler</span>
      </div>
    </div>
    <button class="desktop-logout" onclick="logoutUser()">Logout</button>
  </div>
</header>
