<!-- HOME SECTION -->
<main id="home" class="screen active">
  <header class="topbar">
    <div class="brand">
      <img src="assets/logo.png" alt="LokaLink Logo" class="logo-img" style="height:32px">
      LokaLink
    </div>
    <button class="icon-btn" onclick="showToast('Notifications are ready for the MVP.')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Z"/>
        <path d="M10 21h4"/>
      </svg>
    </button>
  </header>

  <div class="greeting">
    <h1>Good Morning, Alex 👋</h1>
    <p>Find experiences in KEK Mandalika</p>
  </div>

  <label class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path>
    </svg>
    <input id="homeSearch" type="search" placeholder="Search local experiences..." oninput="filterHome()">
  </label>

  <div class="section" style="margin-top:18px">
    <div class="chips" id="homeChips">
      <button class="chip active" data-cat="All" onclick="setCategory('All')">Semua</button>
      <button class="chip" data-cat="Pengalaman Lokal" onclick="setCategory('Pengalaman Lokal')">🤝 Pengalaman Masyarakat Lokal</button>
      <button class="chip" data-cat="Destinasi Wisata" onclick="setCategory('Destinasi Wisata')">📍 Destinasi Wisata</button>
    </div>
  </div>

  <div class="section">
    <div class="section-head" style="padding:0 18px">
      <h2 class="section-title">Pilihan Pengalaman Utama</h2>
      <button class="see-all" onclick="goTo('discover')">Jelajahi</button>
    </div>

    <article class="featured" onclick="openDetail('menenunsade')">
      <img src="assets/img/desaadatsade.jpg" alt="Menenun Kain Songket Tradisional">
      <div class="featured-content">
        <span class="pill">✦ Pengalaman Lokal</span>
        <h2>Menenun Kain Songket Tradisional</h2>
        <div class="featured-row">
          <span class="featured-meta">Pengalaman Lokal · Desa Sade · ★ 4.9</span>
          <button class="btn btn-primary" onclick="event.stopPropagation(); openDetail('menenunsade')">Booking Host</button>
        </div>
      </div>
    </article>
  </div>

  <div class="section">
    <div class="section-head" style="padding:0 18px">
      <h2 class="section-title">Trending Experiences</h2>
      <button class="see-all" onclick="goTo('discover')">See all</button>
    </div>
    <div id="trendingList" class="experience-list" style="padding:0 18px"></div>
  </div>
</main>
