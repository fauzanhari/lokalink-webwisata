<!-- PROFILE SECTION -->
<main id="profile" class="screen">
  <div class="profile">
    <div class="profile-card">
      <img
        class="profile-avatar"
        src="https://i.pravatar.cc/160?img=12"
        alt="Alex profile" />
      <h1>Fauzan Hari</h1>
      <p>Traveler · Exploring Lombok since 2026</p>
      <div class="profile-actions">
        <button class="btn btn-primary btn-block" onclick="openEditProfile()">
          Edit Profile
        </button>
      </div>
    </div>

    <div class="profile-menu">
      <div class="menu-item" onclick="goTo('saved')">
        <div class="mi">♡</div>
        <strong>Saved experiences</strong><span>0 saved ›</span>
      </div>
      <div class="menu-item" onclick="openLanguage()">
        <div class="mi">Aa</div>
        <strong>Language</strong><span>English ›</span>
      </div>
      <div class="menu-item" onclick="logoutUser()">
        <div class="mi">↪</div>
        <strong>Log out</strong><span>Sign out of LokaLink ›</span>
      </div>
    </div>
  </div>
</main>
